name: is_web_request_driver
description: >-
  intersyntactic's web request driver: sends requests out of the home under the
  person's sign-ins, holding each sign-in's secret so neither a tool nor the
  logbook ever sees it.
version: 0.14.0
repository: https://github.com/intersyntactic/web_request_driver

environment:
  sdk: ^3.13.0

dependencies:
  is_effects: ^0.17.0
  is_sign_in_vocabulary: ^0.1.0
  is_unix_socket_user_check: ^0.2.1
  is_web_address_vocabulary: ^0.1.2

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
